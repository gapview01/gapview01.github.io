<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Space+Grotesk:wght@400;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#1A1A1A; }
  .screen { position:relative; width:100%; min-height:100dvh; overflow:hidden; background:#1A1A1A;
            display:flex; flex-direction:column; padding:0 24px; font-family:'Space Grotesk',system-ui,sans-serif; }

  /* top bar */
  .topbar { display:flex; align-items:center; gap:8px; padding-top:24px; }
  .back { width:24px; height:24px; flex:0 0 auto; }
  .back svg { stroke:rgba(255,255,255,0.7); }
  .progress { flex:1 1 auto; display:flex; justify-content:center; }
  .track { width:200px; height:3px; border-radius:999px; background:rgba(255,255,255,0.12); overflow:hidden; }
  .fill { width:16%; height:100%; background:#00B5A5; border-radius:999px; }
  .chip { flex:0 0 auto; display:flex; align-items:center; gap:8px; }
  .chip svg { stroke:#FF6A2C; }
  .chip span { font-size:11px; font-weight:700; letter-spacing:0.12em; color:rgba(255,255,255,0.85); }

  /* headline */
  .h1 { margin-top:64px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:40px;
        line-height:1.05; letter-spacing:-0.03em; color:#fff; white-space:nowrap; }
  .h1 .dot { color:#FF6A2C; }
  .subcopy { margin-top:8px; font-size:17px; font-weight:400; color:rgba(255,255,255,0.55); white-space:nowrap; }

  /* card */
  .card { margin-top:34px; border-radius:20px; background:#161616; border:1px solid rgba(255,255,255,0.06); overflow:hidden; }
  .row { height:76px; display:flex; align-items:center; gap:16px; padding:0 20px; }
  .row + .row { border-top:1px solid rgba(255,255,255,0.05); }
  .tile { width:44px; height:44px; flex:0 0 auto; border-radius:12px; background:rgba(255,106,44,0.12);
          display:flex; align-items:center; justify-content:center; }
  .tile svg { stroke:#FF6A2C; }
  .rowtext { font-size:17px; line-height:1.3; }
  .rowtext b { color:#fff; font-weight:700; }
  .rowtext span { color:rgba(255,255,255,0.55); font-weight:400; }

  /* footer */
  .grow { flex:1 1 auto; min-height:24px; }
  .footer { padding-bottom:32px; }
  .legal { text-align:center; margin-bottom:20px; font-size:13px; color:rgba(255,255,255,0.5); }
  .legal a { color:#FF6A2C; font-weight:600; text-decoration:none; }
  .cta { width:100%; height:60px; border:none; border-radius:999px; background:#00B5A5; color:#0E0E0E;
         font-family:'Plus Jakarta Sans',sans-serif; font-size:18px; font-weight:700;
         display:flex; align-items:center; justify-content:center; gap:10px; }
  .cta svg { stroke:#0E0E0E; }
  .stripe { position:absolute; bottom:0; left:0; right:0; height:3px;
            background:linear-gradient(90deg,#FF6A2C 0%,#E8B84A 50%,#00B5A5 100%); }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <span class="back" style="cursor:pointer" onclick="history.length>1?history.back():location.href='welcome.html'"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
      <span class="progress"><span class="track"><span class="fill"></span></span></span>
      <span class="chip">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke-width="1.6"><rect x="1.2" y="1.2" width="9.6" height="9.6" rx="2"/></svg>
        <span>BOX IT</span>
      </span>
    </div>

    <div class="h1">Hi, I&rsquo;m Toreva<span class="dot">.</span></div>
    <div class="subcopy">This is how I work.</div>

    <div class="card">
      <div class="row">
        <span class="tile"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="14" height="14" rx="3"/></svg></span>
        <span class="rowtext"><b>Box it.</b> <span>Pick USDC or SOL.</span></span>
      </div>
      <div class="row">
        <span class="tile"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="18" y2="7"/><line x1="4" y1="11" x2="18" y2="11"/><line x1="4" y1="15" x2="18" y2="15"/><circle cx="14" cy="7" r="2" fill="#1A1A1A"/><circle cx="8" cy="11" r="2" fill="#1A1A1A"/><circle cx="13" cy="15" r="2" fill="#1A1A1A"/></svg></span>
        <span class="rowtext"><b>Rule it.</b> <span>Set your limits.</span></span>
      </div>
      <div class="row">
        <span class="tile"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M7 5l10 6-10 6z"/></svg></span>
        <span class="rowtext"><b>Run it.</b> <span>Toreva does the rest.</span></span>
      </div>
    </div>

    <div class="grow"></div>

    <div class="footer">
      <div class="legal">By continuing, you agree to <a href="terms.html">Terms</a> &amp; <a href="#">Privacy</a></div>
      <button class="cta" style="cursor:pointer" onclick="location.href='index.html'">Continue
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="stripe"></div>
  </div>
</body>
</html>
