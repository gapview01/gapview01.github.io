<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" /><meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#1B1B1E;}
  .screen{position:relative;width:100%;min-height:100dvh;overflow:hidden;background:#1B1B1E;
          display:flex;flex-direction:column;padding:0 24px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
  /* shared top bar */
  .topbar{display:flex;align-items:center;gap:12px;padding-top:20px;}
  .back{width:24px;height:24px;flex:0 0 auto;cursor:pointer;}
  .back svg{stroke:rgba(255,255,255,0.9);}
  .segs{flex:1 1 auto;display:flex;gap:6px;}
  .seg{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.12);}
  .seg.box{background:#00B5A5;}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .sq{width:11px;height:11px;border-radius:2px;background:#00B5A5;}
  .chip span{font-size:13px;font-weight:600;letter-spacing:0.04em;color:rgba(255,255,255,0.8);text-transform:uppercase;}
  /* title block — centered */
  .title{margin-top:40px;text-align:center;font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-0.02em;color:#fff;}
  .sub{margin-top:10px;text-align:center;font-size:16px;font-weight:500;line-height:1.4;color:rgba(255,255,255,0.55);white-space:nowrap;}
  /* phrase card */
  .card{position:relative;margin-top:28px;border-radius:24px;background:#26262A;padding:20px 16px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .word{display:flex;align-items:center;height:48px;border-radius:9999px;background:rgba(255,255,255,0.04);padding:0 16px;}
  .word .idx{flex:0 0 20px;width:20px;text-align:right;font-size:13px;font-weight:500;color:rgba(255,255,255,0.35);}
  .word .w{margin-left:12px;font-size:16px;font-weight:600;color:#fff;}
  /* reveal overlay */
  .overlay{position:absolute;inset:0;border-radius:24px;display:flex;align-items:center;justify-content:center;
           backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(20,20,20,0.35);
           transition:opacity .2s;cursor:pointer;}
  .reveal-pill{display:flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:9999px;
               background:#1F1F1F;border:1px solid rgba(255,255,255,0.08);}
  .reveal-pill svg{stroke:#fff;}
  .reveal-pill span{font-size:13px;font-weight:600;color:#fff;}
  .card.shown .overlay{opacity:0;pointer-events:none;}
  /* copy row — flat, not a pill */
  .copy{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;
        font-size:13px;font-weight:500;color:rgba(255,255,255,0.55);cursor:not-allowed;opacity:0.5;transition:opacity .2s;}
  .copy svg{stroke:rgba(255,255,255,0.55);}
  .card.shown ~ .copy{opacity:1;cursor:pointer;}
  /* footer */
  .grow{flex:1 1 auto;min-height:24px;}
  .footer{padding-bottom:24px;}
  .cta{width:100%;height:64px;border:none;border-radius:9999px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.35);
       font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:700;
       display:flex;align-items:center;justify-content:center;gap:8px;cursor:not-allowed;transition:background .15s,color .15s;}
  .cta.on{background:#00B5A5;color:#0E0E0E;cursor:pointer;}
  .stripe{position:absolute;bottom:0;left:0;right:0;height:3px;
          background:linear-gradient(90deg,#FF6A2C 0%,#E8B84A 50%,#00B5A5 100%);}
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <span class="back" onclick="history.length>1?history.back():location.href='birthday.html'"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
      <span class="segs"><span class="seg box"></span><span class="seg"></span><span class="seg"></span></span>
      <span class="chip"><span class="sq"></span><span>Box it</span></span>
    </div>

    <div class="title">Recovery Phrase</div>
    <div class="sub">Write it down. Don&rsquo;t share it.</div>

    <div class="card" id="card">
      <div class="grid">
        <div class="word"><span class="idx">1</span><span class="w">ribbon</span></div>
        <div class="word"><span class="idx">2</span><span class="w">canyon</span></div>
        <div class="word"><span class="idx">3</span><span class="w">velvet</span></div>
        <div class="word"><span class="idx">4</span><span class="w">harbor</span></div>
        <div class="word"><span class="idx">5</span><span class="w">summit</span></div>
        <div class="word"><span class="idx">6</span><span class="w">meadow</span></div>
        <div class="word"><span class="idx">7</span><span class="w">lantern</span></div>
        <div class="word"><span class="idx">8</span><span class="w">copper</span></div>
        <div class="word"><span class="idx">9</span><span class="w">orbit</span></div>
        <div class="word"><span class="idx">10</span><span class="w">willow</span></div>
        <div class="word"><span class="idx">11</span><span class="w">pebble</span></div>
        <div class="word"><span class="idx">12</span><span class="w">anchor</span></div>
      </div>
      <div class="overlay" id="overlay" onclick="reveal()">
        <div class="reveal-pill">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Tap to Reveal</span>
        </div>
      </div>
    </div>

    <div class="copy" id="copy" onclick="if(document.getElementById('card').classList.contains('shown'))doCopy()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <span id="copyLabel">Copy</span>
    </div>

    <div class="grow"></div>

    <div class="footer">
      <button id="go" class="cta" onclick="if(this.classList.contains('on'))location.href='are-you-sure.html'">I wrote it down</button>
    </div>
    <div class="stripe"></div>
  </div>
  <script>
    function reveal(){
      document.getElementById('card').classList.add('shown');
      document.getElementById('go').classList.add('on');
    }
    function doCopy(){
      var lbl=document.getElementById('copyLabel');
      lbl.textContent='Copied';
      setTimeout(function(){lbl.textContent='Copy';},1400);
    }
  </script>
</body>
</html>
