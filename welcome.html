<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Space+Grotesk:wght@500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#1A1A1A; }
  .screen {
    position:relative; width:100%; min-height:100dvh; overflow:hidden;
    background:#1A1A1A;                       /* flat charcoal — no glows */
    display:flex; flex-direction:column; padding:0 32px;
    font-family:'Space Grotesk', system-ui, sans-serif;
  }
  /* robot CONTAINED upper-right, only a small bleed off the right edge (like the reference) */
  /* real asset toreva-head-tilted.png — already tilted; transparent padding so sized by visual match */
  .robot {
    position:absolute; width:326px; top:6px; right:-58px; z-index:1;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.55));
    pointer-events:none; user-select:none;
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  .ph { position:absolute; top:10px; left:10px; z-index:9; font-size:9px; letter-spacing:.03em;
        color:#6a6a6c; background:#000a; padding:2px 6px; border-radius:5px; }
  .hero { height:330px; flex:0 0 auto; }                 /* space for the robot */
  .headline {
    z-index:2; font-family:'Plus Jakarta Sans', sans-serif; font-weight:800;
    font-size:62px; line-height:1.04; letter-spacing:-0.04em; color:#fff;
  }
  .line { display:block; white-space:nowrap; }
  .odot { display:inline-block; width:11px; height:11px; border-radius:50%; background:#FF6A2C; margin-left:3px; vertical-align:-3px; }
  .sub {
    margin-top:20px; z-index:2; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:27px; letter-spacing:-0.01em; color:#fff; display:flex; align-items:center; gap:10px;
  }
  .reel { display:inline-block; height:1.2em; overflow:hidden; position:relative; }
  .reel ul { list-style:none; animation: roll 6s steps(1,end) infinite; }
  .reel li { height:1.2em; line-height:1.2em; font-weight:700;
             background:linear-gradient(90deg,#00B5A5 0%,#E8B84A 100%);
             -webkit-background-clip:text; background-clip:text; color:transparent; }
  @keyframes roll {
    0%,18%{transform:translateY(0)} 25%,43%{transform:translateY(-1.2em)}
    50%,68%{transform:translateY(-2.4em)} 75%,93%{transform:translateY(-3.6em)} 100%{transform:translateY(-4.8em)}
  }
  .grow { flex:1 1 auto; min-height:24px; }
  .footer { z-index:3; padding-bottom:34px; }
  .signin { text-align:left; margin-bottom:22px; font-family:'Space Grotesk',sans-serif;
            font-size:18px; font-weight:500; color:rgba(255,255,255,0.6); }
  .signin a { color:#FF6A2C; font-weight:700; text-decoration:none; }
  .cta { width:100%; height:66px; border:none; border-radius:999px; background:#00B5A5; color:#161616;
         font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; letter-spacing:-0.02em;
         display:flex; align-items:center; justify-content:center; gap:14px; }
  @media (prefers-reduced-motion: reduce){ .robot{animation:none} .reel ul{animation:none} }
</style>
</head>
<body>
  <div class="screen">
    <img class="robot" src="robot.png" alt="" />
    <div class="hero"></div>
    <div class="headline">
      <span class="line">Box it<i class="odot"></i></span>
      <span class="line">Rule it<i class="odot"></i></span>
      <span class="line">Run it<i class="odot"></i></span>
    </div>
    <div class="sub">
      <span>Your</span>
      <span class="reel"><ul><li>USDC</li><li>SOL</li><li>yield</li><li>stake</li><li>USDC</li></ul></span>
    </div>
    <div class="grow"></div>
    <div class="footer">
      <div class="signin">Already have an account? <a href="#">Sign in</a></div>
      <button class="cta">Get started&nbsp;&nbsp;&#8594;</button>
    </div>
  </div>
</body>
</html>
