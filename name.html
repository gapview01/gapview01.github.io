<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" /><meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#1B1B1E;}
  .screen{position:relative;width:100%;min-height:100dvh;overflow:hidden;background:#1B1B1E;
          display:flex;flex-direction:column;padding:0 24px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
  /* shared top bar */
  .topbar{display:flex;align-items:center;gap:12px;padding-top:20px;}
  .back{width:24px;height:24px;flex:0 0 auto;cursor:pointer;}
  .back svg{stroke:rgba(255,255,255,0.9);}
  .segs{flex:1 1 auto;display:flex;gap:6px;}
  .seg{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.12);}
  .seg.on{background:#00B5A5;}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .chip svg{stroke:#00B5A5;}
  .chip span{font-size:13px;font-weight:600;letter-spacing:0.06em;color:#00B5A5;text-transform:uppercase;}
  /* headline */
  .h1{margin-top:56px;font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-0.03em;color:#fff;}
  .h1 .dot{color:#FF6A2C;}
  .sub{margin-top:12px;font-size:16px;font-weight:500;line-height:1.4;letter-spacing:-0.01em;color:rgba(255,255,255,0.6);white-space:nowrap;}
  /* name input — pill matching the CTA */
  .field{margin-top:32px;width:100%;height:64px;border-radius:9999px;background:rgba(255,255,255,0.04);
         border:1px solid rgba(255,255,255,0.10);padding:0 24px;color:#fff;
         font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:500;outline:none;}
  .field::placeholder{color:rgba(255,255,255,0.4);}
  .field:focus{border-color:#00B5A5;}
  /* footer */
  .grow{flex:1 1 auto;min-height:24px;}
  .footer{padding-bottom:24px;}
  .cta{width:100%;height:64px;border:none;border-radius:9999px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.35);
       font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:700;
       display:flex;align-items:center;justify-content:center;gap:8px;cursor:not-allowed;transition:background .15s,color .15s;}
  .cta.on{background:#00B5A5;color:#0E0E0E;cursor:pointer;}
  .cta svg{stroke:currentColor;}
  .stripe{position:absolute;bottom:0;left:0;right:0;height:3px;
          background:linear-gradient(90deg,#FF6A2C 0%,#E8B84A 50%,#00B5A5 100%);}
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <span class="back" onclick="history.length>1?history.back():location.href='protected.html'"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
      <span class="segs"><span class="seg on"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span></span>
      <span class="chip"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke-width="1.5"><rect x="1.6" y="1.6" width="10.8" height="10.8" rx="2.5"/></svg><span>Box it</span></span>
    </div>

    <div class="h1">Your name<span class="dot">.</span></div>
    <div class="sub">Just for hello. Legal name later.</div>

    <input id="nm" class="field" type="text" placeholder="Your name" autocomplete="name" autocapitalize="words" autofocus
           oninput="document.getElementById('go').classList.toggle('on', this.value.trim().length>0)"
           onkeydown="if(event.key==='Enter'&&this.value.trim())location.href='birthday.html'" />

    <div class="grow"></div>

    <div class="footer">
      <button id="go" class="cta" onclick="if(this.classList.contains('on'))location.href='birthday.html'">Continue
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="stripe"></div>
  </div>
</body>
</html>
